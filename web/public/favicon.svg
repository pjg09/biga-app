<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="purple-grad" cx="38%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#9B3FF5"/>
      <stop offset="55%" stop-color="#7B1FD4"/>
      <stop offset="100%" stop-color="#4A0A9E"/>
    </radialGradient>
    <radialGradient id="green-grad" cx="33%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#D4F870"/>
      <stop offset="45%" stop-color="#80CC20"/>
      <stop offset="100%" stop-color="#2E7008"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000044"/>
    </filter>
  </defs>

  <!-- Purple ring -->
  <circle cx="50" cy="52" r="44" fill="url(#purple-grad)" filter="url(#soft-shadow)"/>

  <!-- Triangle hole (white, rounded corners via stroke-linejoin) -->
  <path
    d="M50,24 L74,68 L26,68 Z"
    fill="white"
    stroke="white"
    stroke-width="10"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Green sphere — top -->
  <circle cx="50" cy="11" r="11" fill="url(#green-grad)"/>
  <ellipse cx="46" cy="7" rx="4" ry="3" fill="rgba(255,255,255,0.45)" transform="rotate(-15,46,7)"/>

  <!-- Green sphere — bottom-right -->
  <circle cx="80" cy="70" r="11" fill="url(#green-grad)"/>
  <ellipse cx="76" cy="66" rx="4" ry="3" fill="rgba(255,255,255,0.45)" transform="rotate(-15,76,66)"/>

  <!-- Green sphere — bottom-left -->
  <circle cx="20" cy="70" r="11" fill="url(#green-grad)"/>
  <ellipse cx="16" cy="66" rx="4" ry="3" fill="rgba(255,255,255,0.45)" transform="rotate(-15,16,66)"/>
</svg>
