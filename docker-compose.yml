services:
  api:
    build:
      context: ./api
    ports:
      - "8001:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - ./api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - ./api:/app
    command: celery -A app.core.celery:celery_app worker --loglevel=info

  beat:
    build:
      context: ./api
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./api:/app
    command: celery -A app.core.celery:celery_app beat --loglevel=info

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: biga
      POSTGRES_USER: biga
      POSTGRES_PASSWORD: biga
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biga"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage-init:
    image: minio/mc
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local $${STORAGE_ENDPOINT_URL} $${STORAGE_ACCESS_KEY} $${STORAGE_SECRET_KEY} &&
      mc mb --ignore-existing local/$${STORAGE_BUCKET_NAME}
      "

  web:
    build:
      context: ./web
    ports:
      - "5175:5175"
    volumes:
      - ./web:/app
      - /app/node_modules
    command: npm run dev -- --host --port 5175

volumes:
  postgres_data:
  minio_data:
