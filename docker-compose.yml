services:
  # TZ en api/worker/beat/postgres: las imágenes base corren en UTC y, sin esto,
  # `date.today()` adelanta un día entre las 19:00 y medianoche hora de Colombia.
  # Eso escribía la fecha equivocada en attendance_records, pae_deliveries y
  # early_departures — no era un problema de presentación, el dato entraba mal.
  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      TZ: America/Bogota
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - ./api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./api
    env_file: .env
    environment:
      TZ: America/Bogota
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - ./api:/app
    command: celery -A app.core.celery:celery_app worker --loglevel=info

  beat:
    build:
      context: ./api
    env_file: .env
    environment:
      TZ: America/Bogota
    depends_on:
      - redis
    volumes:
      - ./api:/app
    command: celery -A app.core.celery:celery_app beat --loglevel=info

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: biga
      POSTGRES_USER: biga
      POSTGRES_PASSWORD: biga
      TZ: America/Bogota
      PGTZ: America/Bogota
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # `TZ`/`PGTZ` solo aplican al initdb de un cluster nuevo; este ya existía con
    # timezone='Etc/UTC' en postgresql.conf, así que hay que forzarlo por flag.
    command: postgres -c timezone=America/Bogota -c log_timezone=America/Bogota
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biga"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage-init:
    image: minio/mc
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local $${STORAGE_ENDPOINT_URL} $${STORAGE_ACCESS_KEY} $${STORAGE_SECRET_KEY} &&
      mc mb --ignore-existing local/$${STORAGE_BUCKET_NAME}
      "

  web:
    build:
      context: ./web
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
  minio_data:
